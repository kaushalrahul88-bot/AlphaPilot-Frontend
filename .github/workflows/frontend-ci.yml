name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint changed TypeScript files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/lint-regressions.mjs "$BASE_SHA"

      - name: Type-check application
        run: npm run typecheck

      - name: Build production bundle
        run: npm run build
